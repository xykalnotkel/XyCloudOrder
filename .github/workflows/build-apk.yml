name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mock:
        description: "Pakai data demo (tanpa server)?"
        required: false
        default: "false"
      base_url:
        description: "Base URL API XyCloud"
        required: false
        default: "https://xycloud-api.akuntiktok76y.workers.dev"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.5"
  APP_DIR: app

jobs:
  build:
    name: Build APK (release)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Info toolchain
        run: |
          flutter --version
          java -version

      - name: Generate platform Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter create . \
            --platforms=android \
            --org id.xycloud \
            --project-name xycloud_order \
            --description "XyCloudOrder - Sewa PC Cloud, Beli Akun, CS Realtime"

      - name: Bersihkan berkas bawaan flutter create
        working-directory: ${{ env.APP_DIR }}
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: ${{ env.APP_DIR }}
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        working-directory: ${{ env.APP_DIR }}
        run: dart run flutter_native_splash:create

      - name: Set nama aplikasi & izin internet
        working-directory: ${{ env.APP_DIR }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="XyCloudOrder"/' $MANIFEST
          grep -q 'android.permission.INTERNET' $MANIFEST || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $MANIFEST
          echo "----- manifest -----"
          cat $MANIFEST

      - name: Siapkan keystore rilis
        working-directory: ${{ env.APP_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 kosong, build memakai kunci debug."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/xycloud-release.jks
          cat > android/key.properties <<EOF
          storeFile=xycloud-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          python3 ../tools/patch_signing.py android/app
          echo "Keystore siap: $(sha256sum android/xycloud-release.jks | cut -c1-16)"

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: ${{ env.APP_DIR }}
        run: flutter test || echo "Test dilewati (non-blocking)"

      - name: Build APK universal
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build apk --release \
            --dart-define=XY_MOCK=${{ github.event.inputs.mock || 'false' }} \
            --dart-define=XY_BASE_URL=${{ github.event.inputs.base_url || 'https://xycloud-api.akuntiktok76y.workers.dev' }}

      - name: Build APK per-ABI
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=XY_MOCK=${{ github.event.inputs.mock || 'false' }} \
            --dart-define=XY_BASE_URL=${{ github.event.inputs.base_url || 'https://xycloud-api.akuntiktok76y.workers.dev' }}

      - name: Rapikan hasil build
        run: |
          mkdir -p dist
          cp ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk dist/XyCloudOrder-universal.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f=${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-$abi-release.apk
            [ -f "$f" ] && cp "$f" "dist/XyCloudOrder-$abi.apk" || true
          done
          ls -lh dist

      - name: Verifikasi tanda tangan APK
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n1)
          for f in dist/*.apk; do
            echo "----- $f"
            "$APKSIGNER" verify --print-certs "$f" | head -n 8 || echo "Tidak dapat diverifikasi"
          done

      - name: Upload artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: XyCloudOrder-APK
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Ringkasan build
        run: |
          {
            echo "## XyCloudOrder - Build selesai"
            echo ""
            echo "| Berkas | Ukuran |"
            echo "|---|---|"
            for f in dist/*.apk; do
              echo "| $(basename $f) | $(du -h $f | cut -f1) |"
            done
            echo ""
            echo "Unduh lewat bagian **Artifacts** di halaman run ini."
          } >> $GITHUB_STEP_SUMMARY

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XyCloudOrder-APK
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
