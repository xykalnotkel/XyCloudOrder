name: Deploy Dashboard Next.js

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "api/src/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps
        working-directory: dashboard
        run: npm ci

      - name: Build Next.js static export
        working-directory: dashboard
        env:
          NEXT_PUBLIC_API_BASE: https://api.xycloud.my.id
        run: npm run build

      - name: Upload out artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-out
          path: dashboard/out
          retention-days: 14

  # Set repo variable ENABLE_CF_PAGES=true + secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
  deploy-cloudflare:
    name: Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_CF_PAGES == 'true' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-out
          path: dashboard/out
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # packageManager npm + npx yes menghindari gagal "npx canceled due to missing packages"
          packageManager: npm
          command: pages deploy dashboard/out --project-name=xycloud-dashboard --commit-dirty=true

  # Set repo variable ENABLE_VERCEL=true + secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  # Catatan: rootDirectory project Vercel = "dashboard", jadi CLI harus dijalankan
  # dari root monorepo (bukan working-directory: dashboard) supaya path tidak jadi dashboard/dashboard.
  deploy-vercel:
    name: Vercel production
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_VERCEL == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy from monorepo root
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  # Set repo variable ENABLE_WORKER_DEPLOY=true + secrets CLOUDFLARE_*
  deploy-worker:
    name: Cloudflare Worker API
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_WORKER_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy Worker
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --no-audit --no-fund
          npx wrangler deploy
