name: Deploy Dashboard Next.js

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps
        working-directory: dashboard
        run: npm ci

      - name: Build Next.js
        working-directory: dashboard
        env:
          NEXT_PUBLIC_API_BASE: https://api.xycloud.my.id
        run: npm run build

      # Option 1: Deploy to Cloudflare Pages
      # Needs secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
      # Uncomment if you have Pages project "xycloud-dashboard"
      # - name: Deploy to Cloudflare Pages
      #   uses: cloudflare/pages-action@v1
      #   with:
      #     apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     projectName: xycloud-dashboard
      #     directory: dashboard/.next
      #     gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Option 2: Deploy to Vercel (needs VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID)
      # - uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     working-directory: ./dashboard

      - name: Upload build artifact (preview)
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/.next
          retention-days: 7
