name: Check embedded streaming library
on:
  push:
    branches: [native-integration-check]
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true
      - name: Generate Android platform
        working-directory: app
        run: |
          flutter create . --platforms=android --org id.xycloud --project-name xycloud_order
          flutter pub get
      - name: Prepare pinned streaming source
        run: python3 tools/siapkan_streaming.py
      - name: Compile native library (all three APK ABIs)
        working-directory: app/android
        run: ./gradlew :xy_stream:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: XyCloud-Streaming-AAR
          path: native/xy_stream/build/outputs/aar/*.aar
