name: Build Agen Windows (Rust/Tauri)

on:
  push:
    branches: [main]
    paths:
      - "agent-gui/**"
      - ".github/workflows/agent-windows.yml"
  workflow_dispatch:

concurrency:
  group: agent-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bangun agen Rust/Tauri jadi .exe (tanpa Python)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pasang toolchain Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache kargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-gui/src-tauri

      - name: Bangun rilis (cargo build --release)
        shell: pwsh
        working-directory: agent-gui/src-tauri
        run: |
          cargo build --release --locked
          Get-Item target/release/xycloud-agent.exe | Select-Object Name, Length

      - name: Kemas exe + uji versi + zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item agent-gui/src-tauri/target/release/xycloud-agent.exe `
            dist/XyCloudStore-Agent.exe -Force
          Copy-Item agent-gui/README.md dist/README.md -Force
          # Smoke-test: exe berjalan dan melaporkan versi (tanpa Python)
          & .\dist\XyCloudStore-Agent.exe --veri
          if ($LASTEXITCODE -ne 0) { throw "Smoke-test --veri gagal" }
          Compress-Archive -Path dist/XyCloudStore-Agent.exe, dist/README.md `
            -DestinationPath XyCloudStore-Agent-Windows.zip -Force
          Get-Item XyCloudStore-Agent-Windows.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XyCloudStore-Agent-Windows
          path: XyCloudStore-Agent-Windows.zip
          if-no-files-found: error
