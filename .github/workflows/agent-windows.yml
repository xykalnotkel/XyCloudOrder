name: Build Agen Windows (Rust/egui native)

on:
  push:
    branches: [main]
    paths:
      - "agent-gui/**"
      - ".github/workflows/agent-windows.yml"
  workflow_dispatch:

concurrency:
  group: agent-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bangun agen Rust/egui native jadi .exe (tanpa Tauri/WebView/terminal)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pasang toolchain Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache kargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-gui/src-native

      - name: Bangun rilis native (cargo build --release)
        shell: pwsh
        working-directory: agent-gui/src-native
        run: |
          # Native egui/eframe — tidak perlu tauri-cli, WebView2, maupun dev server.
          cargo build --release --locked
          $exe = Get-Item "target/release/xycloud-agent.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "xycloud-agent.exe tidak ketemu setelah cargo build" }
          Write-Host "EXE:" $exe.FullName $exe.Length
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Copy-Item $exe.FullName ../dist/XyCloudStore-Agent.exe -Force
          Copy-Item ../README.md ../dist/README.md -Force

      - name: Smoke-test versi
        shell: pwsh
        working-directory: agent-gui
        run: |
          # Exe rilis memakai windows_subsystem="windows" → pwsh `&` tidak menunggu
          # dan $LASTEXITCODE kosong. Pakai Start-Process -Wait + redirect stdout.
          $p = Start-Process -FilePath .\dist\XyCloudStore-Agent.exe -ArgumentList '--veri' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput ..\veri.txt
          Get-Content ..\veri.txt
          if ($p.ExitCode -ne 0) { throw "Smoke-test --veri gagal (exit $($p.ExitCode))" }
          if (-not (Select-String -Path ..\veri.txt -Pattern 'XyCloudStore-Agent 1\.5\.' -Quiet)) {
            throw "Output --veri tidak memuat versi yang diharapkan"
          }
          Compress-Archive -Path dist/XyCloudStore-Agent.exe, dist/README.md `
            -DestinationPath ../XyCloudStore-Agent-Windows.zip -Force
          Get-Item ../XyCloudStore-Agent-Windows.zip | Select-Object Name, Length

      - name: Smoke-test GUI (jendela dibuat & dirender, lalu tutup sendiri)
        shell: pwsh
        working-directory: agent-gui
        run: |
          # Menguji jalur yang sebelumnya tak teruji: pembuatan jendela +
          # renderer (glow → fallback wgpu/WARP). Di runner tanpa GPU, glow
          # gagal dan wgpu software yang mengambil alih — persis skenario PC
          # dengan driver GPU tua/RDP.
          $log = "$env:APPDATA\XyCloudStore\Agent\gui.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $p = Start-Process -FilePath .\dist\XyCloudStore-Agent.exe -ArgumentList '--gui-tes' -PassThru -NoNewWindow
          Wait-Process -Id $p.Id -Timeout 180 -ErrorAction SilentlyContinue
          if (Test-Path $log) { Write-Host '--- gui.log ---'; Get-Content $log -Tail 15 }
          if (-not $p.HasExited) { $p.Kill(); throw 'GUI hang >180 dtk (jendela tidak menutup)' }
          if ($p.ExitCode -ne 0) { throw "Smoke-test GUI gagal (exit $($p.ExitCode)) — lihat gui.log di atas" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XyCloudStore-Agent-Windows
          path: XyCloudStore-Agent-Windows.zip
          if-no-files-found: error

      # Tag bergerak agent-windows = link unduhan permanen (bukan v* rilis app)
      - name: Publish unduhan tetap (tag agent-windows)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-windows
          name: XyCloudStore Agent (Windows)
          body: |
            Agen PC Host Windows — build otomatis dari `main`.
            **v1.5 native (egui/eframe):** satu exe mandiri tanpa Tauri, tanpa WebView2, tanpa terminal.
            Auto Sunshine (`sunshine --creds`) + wizard pengaturan + autostart Windows.

            **Unduh:** `XyCloudStore-Agent-Windows.zip` → ekstrak → jalankan `XyCloudStore-Agent.exe`

            Alur: Admin → Unit PC → salin kode → tempel di Agent → Setup Engine → Mulai Agen.
          files: XyCloudStore-Agent-Windows.zip
          fail_on_unmatched_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
