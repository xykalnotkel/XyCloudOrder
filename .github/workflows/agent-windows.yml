name: Build Agen Windows (exe)

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent-windows.yml"
  workflow_dispatch:

concurrency:
  group: agent-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kemas Agen (UI) jadi aplikasi .exe
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pasang ps2exe lalu kemas UI jadi .exe
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force -ErrorAction Stop
          Import-Module ps2exe
          New-Item -ItemType Directory -Force agent/dist | Out-Null
          Invoke-PS2EXE -InputFile agent/xy_agent_ui.ps1 `
            -OutputFile agent/dist/XyCloudStore-Agent.exe
          Get-Item agent/dist/XyCloudStore-Agent.exe | Select-Object Name, Length

      - name: Cek bantuan headless (-Jalankan) muncul di log proses tanpa crash cepat
        shell: pwsh
        run: |
          $exe = (Resolve-Path agent/dist/XyCloudStore-Agent.exe).Path
          # tanpa arg: harus membuka jendela; kami cukup pastikan file bisa dieksekusi
          if (-not (Test-Path $exe)) { throw "exe tidak ditemukan" }
          Write-Host "OK exe siap: $exe"

      - name: Bungkus (exe UI + agen Python)
        shell: pwsh
        run: |
          Compress-Archive -Path agent/dist/XyCloudStore-Agent.exe, agent/xy_agent.py, agent/instal_otomatis.ps1 `
            -DestinationPath agent/dist/XyCloudStore-Agent-Windows.zip -Force
          Get-Item agent/dist/XyCloudStore-Agent-Windows.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XyCloudStore-Agent-Windows
          path: agent/dist/XyCloudStore-Agent-Windows.zip
          if-no-files-found: error
