<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XyCloud Console</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#2F5BFF;--violet:#7B5CFF;--cyan:#17C3E0;--gold:#E0A33B;--ok:#12A66C;--warn:#E0A33B;--danger:#E0453B;
  --bg:#070B14;--panel:#0E1524;--panel2:#131C2E;--line:#1E2940;--ink:#E8EDF7;--muted:#7A879C;--r:14px}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;letter-spacing:-.01em;font-size:14px}
a{color:var(--primary);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#22304d;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- login ---------- */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 600px at 30% 20%,#16213E,#070B14);z-index:50;padding:20px}
.gatebox{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px}
.logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--primary),#6A4BFF);
  display:flex;align-items:center;justify-content:center;box-shadow:0 14px 32px rgba(47,91,255,.4)}

/* ---------- layout ---------- */
.wrap{display:none;grid-template-columns:250px 1fr;min-height:100vh}
.wrap.on{display:grid}
aside{background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:5px}
aside .brand{display:flex;gap:12px;align-items:center;padding:0 8px 22px}
aside button{display:flex;align-items:center;gap:11px;width:100%;background:0;border:0;color:var(--muted);
  font-family:inherit;font-size:13.5px;font-weight:600;padding:11px 13px;border-radius:11px;cursor:pointer;text-align:left;transition:.16s}
aside button:hover{background:var(--panel2);color:var(--ink)}
aside button.on{background:linear-gradient(135deg,rgba(47,91,255,.18),rgba(123,92,255,.12));color:#fff;font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(47,91,255,.3)}
main{padding:26px 30px 60px;overflow-x:hidden}
.top{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.8px}
.top p{color:var(--muted);font-size:13px;margin-top:2px}
.sp{flex:1}

/* ---------- komponen ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stat b{display:block;font-size:27px;font-weight:800;letter-spacing:-1px;margin-top:8px}
.stat span{color:var(--muted);font-size:12px;font-weight:600}
.ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.btn{border:0;border-radius:11px;padding:11px 17px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,var(--primary),#6A4BFF);color:#fff;display:inline-flex;align-items:center;gap:8px;
  transition:.16s;box-shadow:0 8px 18px rgba(47,91,255,.25)}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:12px;border-radius:9px}
.btn.danger{background:rgba(224,69,59,.15);color:#ff8b83;border:1px solid rgba(224,69,59,.3);box-shadow:none}
.btn.ok{background:rgba(18,166,108,.15);color:#5be0ab;border:1px solid rgba(18,166,108,.3);box-shadow:none}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 14px;
  color:var(--ink);font-family:inherit;font-size:13.5px;outline:none;transition:.16s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,91,255,.14)}
label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:0 0 7px 2px;letter-spacing:.2px}
.field{margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  padding:0 12px 12px;border-bottom:1px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(255,255,255,.018)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:10.5px;font-weight:800}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--panel2);border:1px solid var(--line);padding:14px 18px;
  border-radius:12px;font-size:13px;font-weight:600;opacity:0;transform:translateY(12px);transition:.3s;z-index:99;
  box-shadow:0 18px 40px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center}
.toast.on{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:rgba(4,7,14,.75);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;width:100%;
  max-width:560px;max-height:88vh;overflow-y:auto}

/* ---------- chat ---------- */
.chatwrap{display:grid;grid-template-columns:290px 1fr;gap:14px;height:calc(100vh - 150px);min-height:460px}
.rooms{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-y:auto}
.room{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.room:hover{background:var(--panel2)}
.room.on{background:linear-gradient(90deg,rgba(47,91,255,.16),transparent);box-shadow:inset 3px 0 0 var(--primary)}
.chat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.chat .head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.chat .body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:72%;padding:11px 15px 8px;border-radius:16px;font-size:13.5px;line-height:1.5}
.msg.u{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.c{align-self:flex-end;background:linear-gradient(135deg,var(--primary),#5A4BFF);border-bottom-right-radius:5px}
.msg.s{align-self:center;background:rgba(255,255,255,.05);color:var(--muted);font-size:11.5px;border-radius:20px;padding:7px 14px}
.msg time{display:block;font-size:9.5px;opacity:.6;margin-top:4px;text-align:right}
.chat .foot{padding:13px 16px;border-top:1px solid var(--line);display:flex;gap:10px}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(18,166,108,.6);animation:pl 1.8s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(18,166,108,0)}100%{box-shadow:0 0 0 0 rgba(18,166,108,0)}}
@media(max-width:820px){.wrap{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto}
  aside .brand{display:none}main{padding:20px 16px 60px}.chatwrap{grid-template-columns:1fr;height:auto}.rooms{max-height:250px}}
</style>
</head>
<body>

<div id="gate">
  <div class="gatebox">
    <div class="logo">
      <svg width="56" height="56" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round">
        <path d="M24 32 44 68M44 32 24 68"/><path d="M56 32 66 50M76 32 66 50M66 50v18"/>
        <circle cx="50" cy="17" r="3.5" fill="rgba(255,255,255,.6)" stroke="none"/>
        <circle cx="50" cy="83" r="3.5" fill="rgba(255,255,255,.6)" stroke="none"/></svg>
    </div>
    <h2 style="font-size:22px;font-weight:800;letter-spacing:-.7px;margin:22px 0 6px">XyCloud Console</h2>
    <p style="color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:26px">Dashboard admin &amp; customer service. Masukkan admin key untuk melanjutkan.</p>
    <div class="field"><label>Admin Key</label><input id="gk" type="password" placeholder="Masukkan admin key" onkeydown="if(event.key==='Enter')masuk()"></div>
    <button class="btn" style="width:100%;justify-content:center" onclick="masuk()">Masuk ke Console</button>
    <p id="gerr" style="color:#ff8b83;font-size:12.5px;margin-top:14px;display:none"></p>
  </div>
</div>

<div class="wrap" id="wrap">
  <aside>
    <div class="brand">
      <div class="logo" style="width:38px;height:38px;border-radius:12px">
        <svg width="38" height="38" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round">
          <path d="M24 32 44 68M44 32 24 68"/><path d="M56 32 66 50M76 32 66 50M66 50v18"/></svg></div>
      <div><div style="font-weight:800;font-size:14.5px">XyCloud</div>
        <div style="color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:1px">CONSOLE</div></div>
    </div>
    <div id="menu"></div>
    <div class="sp"></div>
    <button onclick="keluar()" style="color:#ff8b83">Keluar</button>
  </aside>
  <main id="main"></main>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)tutupModal()"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- ikon ---------- */
const P={
  dash:'<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>',
  cart:'<path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>',
  desktop:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  key:'<circle cx="8" cy="12" r="4"/><path d="M12 12h9l-2 2.5M17.5 12v3"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.7"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/>',
  chat:'<path d="M20.5 12a8.5 8.5 0 0 1-12.2 7.7L3.5 21l1.3-4.6A8.5 8.5 0 1 1 20.5 12Z"/>',
  users:'<circle cx="9" cy="8" r="3.6"/><path d="M2.5 20c.9-3.7 3.5-5.6 6.5-5.6s5.6 1.9 6.5 5.6"/><path d="M16.5 5.2a3.6 3.6 0 0 1 0 6.9M18 20c-.3-1.6-.9-2.9-1.7-3.9"/>',
  logout:'<path d="M14 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8"/><path d="M17 15.5 20.5 12 17 8.5M9.5 12h11"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  send:'<path d="M21.5 3.5 2.5 11l7.5 2.5L12.5 21l9-17.5Z"/>',
  trash:'<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>',
  edit:'<path d="M4 20h4L19 9a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5 4 20Z"/>',
  refresh:'<path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M21 3v5h-5"/>',
  wallet:'<rect x="2.5" y="5.5" width="19" height="14" rx="3"/><path d="M17 12.5h.01"/>',
  money:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M14.5 9.5c-.5-.8-1.4-1.2-2.5-1.2-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1.1 0-2-.4-2.5-1.2"/>',
  box:'<path d="m12 2.8 9 5v8.4l-9 5-9-5V7.8l9-5Z"/><path d="m3 7.8 9 5 9-5M12 12.8v10"/>',
};
const ic=(n,s=18,c='currentColor',w=1.9)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]||''}</svg>`;
document.querySelector('aside button[onclick="keluar()"]').innerHTML=ic('logout')+'Keluar';

/* ---------- state ---------- */
let KEY=localStorage.getItem('xy_admin_key')||'';
let TAB='dash', ROOM=null, WS=null, DATA={};
const rp=n=>'Rp'+(n||0).toLocaleString('id-ID');
const dt=s=>s?new Date(s.includes('T')?s:s.replace(' ','T')+'Z').toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'-';
const jm=s=>s?new Date(s.includes('T')?s:s.replace(' ','T')+'Z').toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'';
function toast(t){const e=document.getElementById('toast');e.innerHTML=ic('refresh',16,'#5be0ab')+t;e.classList.add('on');
  clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
async function api(path,opt={}){
  const r=await fetch('/api/admin'+path,{...opt,headers:{'Content-Type':'application/json','x-admin-key':KEY,...(opt.headers||{})}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Gagal');
  return j.data!==undefined?j.data:j;
}

/* ---------- auth ---------- */
async function masuk(){
  const k=document.getElementById('gk').value.trim();
  if(!k)return;
  try{
    const r=await fetch('/api/admin/stats',{headers:{'x-admin-key':k}});
    if(!r.ok)throw 0;
    KEY=k;localStorage.setItem('xy_admin_key',k);
    document.getElementById('gate').style.display='none';
    document.getElementById('wrap').classList.add('on');
    konek();render();
  }catch(e){
    const el=document.getElementById('gerr');el.textContent='Admin key salah. Coba lagi.';el.style.display='block';
  }
}
function keluar(){localStorage.removeItem('xy_admin_key');location.reload()}

/* ---------- realtime inbox ---------- */
function konek(){
  try{
    WS=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/cs:inbox');
    WS.onmessage=e=>{
      let m;try{m=JSON.parse(e.data)}catch{return}
      if(m.type==='chat.message'){
        toast('Pesan baru dari '+(m.payload.room||'user'));
        if(TAB==='cs'){ if(ROOM===m.payload.room){DATA.msgs.push(m.payload);renderChat()} muatRooms() }
      }
    };
    WS.onclose=()=>setTimeout(konek,4000);
  }catch(e){}
}

/* ---------- menu ---------- */
const MENU=[['dash','dash','Dashboard'],['orders','cart','Order'],['plans','desktop','Paket PC'],
  ['produk','key','Produk Akun'],['banners','image','Banner Slider'],['cs','chat','Inbox CS'],['users','users','Pengguna']];
function render(){
  document.getElementById('menu').innerHTML=MENU.map(([id,i,l])=>
    `<button class="${TAB===id?'on':''}" onclick="ke('${id}')">${ic(i)}${l}</button>`).join('');
  ({dash:vDash,orders:vOrders,plans:vPlans,produk:vProduk,banners:vBanners,cs:vCs,users:vUsers}[TAB])();
}
function ke(t){TAB=t;render()}
const head=(j,s,aksi='')=>`<div class="top"><div><h1>${j}</h1><p>${s}</p></div><div class="sp"></div>${aksi}</div>`;

/* ---------- dashboard ---------- */
async function vDash(){
  const m=document.getElementById('main');
  m.innerHTML=head('Dashboard','Ringkasan operasional XyCloud',
    `<button class="btn ghost" onclick="vDash()">${ic('refresh',16)}Muat ulang</button>`)+'<div class="empty">Memuat...</div>';
  try{
    const d=await api('/stats');
    const kartu=[['Pengguna',d.users,'users','#2F5BFF'],['Total Order',d.orders,'cart','#7B5CFF'],
      ['Order Berjalan',d.ordersAktif,'box','#E0A33B'],['Pendapatan',rp(d.revenue),'money','#12A66C']];
    const maxV=Math.max(1,...d.harian.map(h=>h.v));
    m.innerHTML=head('Dashboard','Ringkasan operasional XyCloud',
      `<button class="btn ghost" onclick="vDash()">${ic('refresh',16)}Muat ulang</button>`)+
      `<div class="grid g4">${kartu.map(([l,v,i,c])=>`<div class="card stat">
        <div class="ico" style="background:${c}22">${ic(i,19,c)}</div><b>${v}</b><span>${l}</span></div>`).join('')}</div>
      <div class="grid g2" style="margin-top:14px">
        <div class="card"><div style="font-weight:800;font-size:15px;margin-bottom:4px">Order 7 hari terakhir</div>
          <div style="color:var(--muted);font-size:12px;margin-bottom:20px">Jumlah order dan nilai transaksi</div>
          ${d.harian.length?d.harian.reverse().map(h=>`<div style="margin-bottom:14px">
            <div style="display:flex;font-size:12px;margin-bottom:6px"><span class="mono" style="color:var(--muted)">${h.d}</span>
              <span class="sp" style="flex:1"></span><b>${h.n} order</b>
              <span style="color:var(--muted);margin-left:10px">${rp(h.v)}</span></div>
            <div style="height:7px;background:#0a1120;border-radius:8px;overflow:hidden">
              <div style="height:100%;width:${Math.round(h.v/maxV*100)}%;border-radius:8px;
                background:linear-gradient(90deg,var(--primary),var(--violet))"></div></div></div>`).join('')
            :'<div class="empty">Belum ada order.</div>'}
        </div>
        <div class="card"><div style="font-weight:800;font-size:15px;margin-bottom:4px">Info Sistem</div>
          <div style="color:var(--muted);font-size:12px;margin-bottom:18px">Status layanan</div>
          ${[['Worker API','Online','var(--ok)'],['Database D1','Terhubung','var(--ok)'],
             ['Realtime Hub', WS&&WS.readyState===1?'Tersambung':'Menyambung', WS&&WS.readyState===1?'var(--ok)':'var(--warn)'],
             ['Total pesan CS',d.pesan+' pesan','var(--muted)'],['Produk akun',d.produk+' item','var(--muted)']]
            .map(([k,v,c])=>`<div style="display:flex;padding:11px 0;border-bottom:1px solid var(--line)">
              <span style="color:var(--muted);font-size:13px">${k}</span><span style="flex:1"></span>
              <b style="color:${c};font-size:13px">${v}</b></div>`).join('')}
        </div></div>`;
  }catch(e){m.innerHTML+=`<div class="card" style="color:#ff8b83">${e.message}</div>`}
}

/* ---------- order ---------- */
const STATUS=['pending','dibayar','provisioning','aktif','selesai','batal'];
const warnaStatus=s=>({aktif:'var(--ok)',selesai:'var(--muted)',batal:'var(--danger)'}[s]||'var(--warn)');
async function vOrders(){
  const m=document.getElementById('main');
  m.innerHTML=head('Order','Kelola dan ubah status order sewa PC',
    `<button class="btn ghost" onclick="vOrders()">${ic('refresh',16)}Muat ulang</button>`)+'<div class="empty">Memuat...</div>';
  const d=await api('/orders');DATA.orders=d;
  m.innerHTML=head('Order','Kelola dan ubah status order sewa PC',
    `<button class="btn ghost" onclick="vOrders()">${ic('refresh',16)}Muat ulang</button>`)+
    (d.length?`<div class="card" style="padding:18px 6px"><table><thead><tr>
      <th>Kode</th><th>Pengguna</th><th>Paket</th><th>Durasi</th><th>Total</th><th>Status</th><th>Dibuat</th><th></th></tr></thead>
      <tbody>${d.map(o=>`<tr>
        <td class="mono"><b>${o.kode}</b></td>
        <td>${o.user_nama||'-'}<div style="color:var(--muted);font-size:11px">${o.user_email||''}</div></td>
        <td>${o.plan_nama}</td><td>${o.durasi_jam} jam</td><td><b>${rp(o.total)}</b></td>
        <td><span class="tag" style="background:${warnaStatus(o.status)}22;color:${warnaStatus(o.status)}">${o.status}</span></td>
        <td style="color:var(--muted);font-size:12px">${dt(o.dibuat)}</td>
        <td><select style="padding:7px 9px;font-size:12px;width:auto" onchange="ubahStatus('${o.id}',this.value)">
          ${STATUS.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td>
      </tr>`).join('')}</tbody></table></div>`
    :'<div class="card empty">Belum ada order masuk.</div>');
}
async function ubahStatus(id,status){
  const body={status};
  if(status==='aktif'){const o=DATA.orders.find(x=>x.id===id);
    body.progress=100;body.mulai=new Date().toISOString();
    body.berakhir=new Date(Date.now()+o.durasi_jam*3600e3).toISOString();
    body.host='103.44.12.'+(20+Math.floor(Math.random()*200))+':3389';
    body.username='xy_'+o.kode.toLowerCase().replace('-','');body.password='Xy#'+Math.floor(Math.random()*9999)+'ok';}
  if(status==='provisioning')body.progress=35;
  await api('/orders/'+id,{method:'PATCH',body:JSON.stringify(body)});
  toast('Status '+id+' diubah ke '+status+'. Push realtime terkirim.');
}

/* ---------- paket PC ---------- */
async function vPlans(){
  const m=document.getElementById('main');
  const d=await api('/plans');DATA.plans=d;
  m.innerHTML=head('Paket PC','Kelola spesifikasi, harga, dan stok unit',
    `<button class="btn" onclick="formPlan()">${ic('plus',16)}Tambah Paket</button>`)+
    `<div class="card" style="padding:18px 6px"><table><thead><tr>
      <th>ID</th><th>Nama</th><th>Spesifikasi</th><th>Region</th><th>Harga/jam</th><th>Unit</th><th></th></tr></thead>
      <tbody>${d.map(p=>`<tr>
        <td class="mono" style="color:var(--muted)">${p.id}</td>
        <td><b>${p.nama}</b>${p.tag?` <span class="tag" style="background:rgba(123,92,255,.16);color:#a58bff">${p.tag}</span>`:''}</td>
        <td style="font-size:12px;color:var(--muted)">${p.gpu}<br>${p.cpu} · ${p.ram_gb}GB · ${p.storage_gb}GB</td>
        <td>${p.region}</td><td><b>${rp(p.harga_per_jam)}</b></td>
        <td><span class="tag" style="background:${p.unit_tersedia?'rgba(18,166,108,.16)':'rgba(224,69,59,.16)'};
          color:${p.unit_tersedia?'#5be0ab':'#ff8b83'}">${p.unit_tersedia}/${p.total_unit}</span></td>
        <td style="white-space:nowrap"><button class="btn sm ghost" onclick='formPlan(${JSON.stringify(p)})'>${ic('edit',14)}</button>
          <button class="btn sm danger" onclick="hapus('plans','${p.id}')">${ic('trash',14)}</button></td>
      </tr>`).join('')}</tbody></table></div>`;
}
function formPlan(p={}){
  const f=[['id','ID (slug)','text',p.id||''],['nama','Nama Paket','text',p.nama||''],['gpu','GPU','text',p.gpu||''],
    ['cpu','CPU','text',p.cpu||''],['ram_gb','RAM (GB)','number',p.ram_gb||16],['storage_gb','Storage (GB)','number',p.storage_gb||256],
    ['harga_per_jam','Harga / jam','number',p.harga_per_jam||5000],['harga_per_hari','Harga / hari','number',p.harga_per_hari||65000],
    ['region','Region','text',p.region||'Jakarta'],['tag','Tag','text',p.tag||''],
    ['total_unit','Total unit','number',p.total_unit||10],['unit_tersedia','Unit tersedia','number',p.unit_tersedia||10]];
  buka(p.id?'Edit Paket PC':'Tambah Paket PC',
    `<div class="grid" style="grid-template-columns:1fr 1fr">${f.map(([k,l,t,v])=>
      `<div class="field"><label>${l}</label><input id="f_${k}" type="${t}" value="${v}"></div>`).join('')}</div>`,
    async()=>{const b={};f.forEach(([k,,t])=>{const v=document.getElementById('f_'+k).value;b[k]=t==='number'?+v:v});
      await api('/plans',{method:'POST',body:JSON.stringify(b)});toast('Paket disimpan');tutupModal();vPlans()});
}

    <div class="grid" style="grid-template-columns:1fr 1fr">

      <div class="field"><label>Kategori</label><input id="f_kategori" value="${p.kategori||'Gaming'}"></div></div>
    <div class="field"><label>Nama Produk</label><input id="f_nama" value="${p.nama||''}"></div>
    <div class="field"><label>Deskripsi</label><textarea id="f_deskripsi" rows="3">${p.deskripsi||''}</textarea></div>
    <div class="grid" style="grid-template-columns:1fr 1fr 1fr">
      <div class="field"><label>Harga</label><input id="f_harga" type="number" value="${p.harga||0}"></div>
      <div class="field"><label>Harga coret</label><input id="f_harga_coret" type="number" value="${p.harga_coret||0}"></div>
      <div class="field"><label>Stok</label><input id="f_stok" type="number" value="${p.stok||0}"></div></div>
    <div class="grid" style="grid-template-columns:1fr 1fr 1fr">
      <div class="field"><label>Rating</label><input id="f_rating" type="number" step="0.1" value="${p.rating||4.8}"></div>
      <div class="field"><label>Terjual</label><input id="f_terjual" type="number" value="${p.terjual||0}"></div>
      <div class="field"><label>Garansi</label><input id="f_garansi" value="${p.garansi||'30 hari'}"></div></div>
    <div class="field"><label>Fitur (pisahkan dengan koma)</label><input id="f_fitur" value="${fitur.join(', ')}"></div>`,

      await api('/produk',{method:'POST',body:JSON.stringify({

        harga:+g('harga'),harga_coret:+g('harga_coret'),stok:+g('stok'),rating:+g('rating'),
        terjual:+g('terjual'),garansi:g('garansi'),

      toast('Produk disimpan');tutupModal();vProduk()});

      <div class="field"><label>Warna 2</label><input id="f_warna2" type="color" value="${b.warna2||'#6A4BFF'}" style="height:44px;padding:5px"></div>

/* ---------- inbox CS ---------- */
async function vCs(){
  const m=document.getElementById('main');
  m.innerHTML=head('Inbox Customer Service','Balas pesan pengguna secara realtime',
    `<span style="display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px">
      <span class="dotlive"></span>${WS&&WS.readyState===1?'Terhubung':'Menyambung'}</span>`)+
    `<div class="chatwrap"><div class="rooms" id="rooms"><div class="empty">Memuat...</div></div>
      <div class="chat" id="chat"><div class="empty" style="margin:auto">Pilih percakapan di sebelah kiri.</div></div></div>`;
  muatRooms();
  if(ROOM)bukaRoom(ROOM);
}
async function muatRooms(){
  const r=await api('/cs/rooms');DATA.rooms=r;
  const el=document.getElementById('rooms');if(!el)return;
  el.innerHTML=r.length?r.map(x=>`<div class="room ${ROOM===x.room?'on':''}" onclick="bukaRoom('${x.room}')">
    <div style="display:flex;align-items:center;gap:9px">
      <div class="ico" style="width:32px;height:32px;background:linear-gradient(135deg,var(--primary),#6A4BFF);font-size:12px;font-weight:800">
        ${(x.nama||'U').charAt(0).toUpperCase()}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px">${x.nama||x.room}</div>
        <div style="color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x.preview||''}</div></div>
      <div style="color:var(--muted);font-size:10px">${jm(x.terakhir)}</div></div></div>`).join('')
    :'<div class="empty">Belum ada percakapan.</div>';
}
async function bukaRoom(room){
  ROOM=room;DATA.msgs=await api('/cs/room/'+encodeURIComponent(room));
  muatRooms();renderChat();
}
function renderChat(){
  const u=(DATA.rooms||[]).find(x=>x.room===ROOM)||{};
  const el=document.getElementById('chat');if(!el)return;
  el.innerHTML=`<div class="head">
      <div class="ico" style="background:linear-gradient(135deg,var(--primary),#6A4BFF);font-weight:800">${(u.nama||'U').charAt(0).toUpperCase()}</div>
      <div><div style="font-weight:800;font-size:14.5px">${u.nama||ROOM}</div>
        <div style="color:var(--muted);font-size:11.5px">${u.email||ROOM}</div></div>
      <div style="flex:1"></div>
      <button class="btn sm ghost" onclick="bukaRoom('${ROOM}')">${ic('refresh',14)}</button></div>
    <div class="body" id="cbody">${(DATA.msgs||[]).map(m=>m.dari==='system'
      ?`<div class="msg s">${m.teks}</div>`
      :`<div class="msg ${m.dari==='user'?'u':'c'}">${m.teks}<time>${jm(m.waktu)}</time></div>`).join('')}</div>
    <div class="foot"><input id="cinp" placeholder="Ketik balasan untuk pengguna..."
        onkeydown="if(event.key==='Enter')balas()" oninput="ketik()">
      <button class="btn" onclick="balas()">${ic('send',16)}Kirim</button></div>`;
  const b=document.getElementById('cbody');b.scrollTop=b.scrollHeight;
}
let _tt;
function ketik(){clearTimeout(_tt);api('/cs/typing',{method:'POST',body:JSON.stringify({room:ROOM,typing:true})}).catch(()=>{});
  _tt=setTimeout(()=>api('/cs/typing',{method:'POST',body:JSON.stringify({room:ROOM,typing:false})}).catch(()=>{}),2200)}
async function balas(){
  const i=document.getElementById('cinp');const t=i.value.trim();if(!t)return;i.value='';
  const m=await api('/cs/reply',{method:'POST',body:JSON.stringify({room:ROOM,teks:t})});
  DATA.msgs.push(m);renderChat();muatRooms();
}

        <td style="color:var(--muted)">${u.phone||'-'}</td>
        <td><span class="tag" style="background:rgba(224,163,59,.16);color:#f0c273">${(u.tier||'').toUpperCase()}</span></td>

function formSaldo(id,nama){
  buka('Sesuaikan Saldo — '+nama,`
    <div class="field"><label>Nominal (boleh minus untuk mengurangi)</label><input id="f_n" type="number" value="50000"></div>
    <div class="field"><label>Catatan transaksi</label><input id="f_c" value="Bonus dari admin"></div>`,
    async()=>{await api('/users/saldo',{method:'POST',body:JSON.stringify({
        user_id:id,nominal:+document.getElementById('f_n').value,catatan:document.getElementById('f_c').value})});

/* ---------- util ---------- */
async function hapus(jenis,id){
  if(!confirm('Hapus '+id+'?'))return;
  await api('/'+jenis+'/'+id,{method:'DELETE'});toast('Dihapus');
  ({plans:vPlans,produk:vProduk,banners:vBanners}[jenis])();
}
function buka(judul,isi,onSimpan){
  document.getElementById('modalBox').innerHTML=
    `<div style="font-size:19px;font-weight:800;letter-spacing:-.5px;margin-bottom:20px">${judul}</div>${isi}
     <div style="display:flex;gap:10px;margin-top:8px"><button class="btn ghost" style="flex:1;justify-content:center" onclick="tutupModal()">Batal</button>
     <button class="btn" style="flex:1;justify-content:center" id="mSave">Simpan</button></div>`;
  document.getElementById('mSave').onclick=async()=>{try{await onSimpan()}catch(e){alert(e.message)}};
  document.getElementById('modal').classList.add('on');
}
const tutupModal=()=>document.getElementById('modal').classList.remove('on');

/* ---------- start ---------- */
if(KEY){document.getElementById('gk').value=KEY;masuk()}
</script>
