apply plugin: 'com.android.library'
android {
    namespace 'com.limelight'
    compileSdk 34
    ndkVersion '23.2.8568313'
    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField 'boolean', 'ROOT_BUILD', 'false'
        buildConfigField 'String', 'APPLICATION_ID', '"id.xycloud.xycloud_order"'
        buildConfigField 'String', 'VERSION_NAME', '"12.1-xycloud"'
        buildConfigField 'int', 'VERSION_CODE', '314'
        resValue 'string', 'app_label', 'XyCloudStore'
        resValue 'string', 'app_label_root', 'XyCloudStore'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        externalNativeBuild { ndkBuild { arguments 'PRODUCT_FLAVOR=nonRoot' } }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    sourceSets {
        main {
            java.srcDirs += ['../../.cache/moonlight/app/src/main/java']
            res.srcDirs += ['../../.cache/moonlight/app/src/main/res']
        }
    }
    externalNativeBuild { ndkBuild { path '../../.cache/moonlight/app/src/main/jni/Android.mk' } }
    packagingOptions { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/*.md'] } }
    lint { abortOnError false }
}
repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
dependencies {
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'
    implementation 'org.jcodec:jcodec:0.2.3'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.squareup.okio:okio:1.17.5'
    implementation 'org.jmdns:jmdns:3.5.7'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
}
