name: xycloud_order
description: "XyCloudStore - Sewa PC Cloud, Beli Akun Digital, dan Customer Service realtime."
publish_to: "none"
version: 1.7.0+10

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  onesignal_flutter: ^5.2.9
  image_picker: ^1.1.2
  flutter_web_auth_2: ^3.1.2
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.2
  package_info_plus: ^8.1.1
  android_intent_plus: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/ilustrasi/

# ---------------------------------------------------------------
#  Ikon launcher (adaptive icon Android)
#  jalankan: dart run flutter_launcher_icons
# ---------------------------------------------------------------
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/brand/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# ---------------------------------------------------------------
#  Splash native (tampil sebelum Flutter engine siap)
#  jalankan: dart run flutter_native_splash:create
# ---------------------------------------------------------------
flutter_native_splash:
  color: "#1A1033"
  image: "assets/brand/splash_logo.png"
  android: true
  ios: false
  web: false
  android_gravity: center
  fullscreen: false
  android_12:
    color: "#1A1033"
    image: "assets/brand/icon_foreground.png"
    icon_background_color: "#FFFFFF"
