[package]
name = "xycloud-agent-native"
version = "1.5.0"
description = "XyCloudStore — Agen PC Host (Rust/egui native, tanpa Tauri & tanpa WebView)"
edition = "2021"

[[bin]]
name = "xycloud-agent"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
# agent.rs dipakai ulang apa adanya dari ../src-tauri/src/agent.rs (#[path]).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
