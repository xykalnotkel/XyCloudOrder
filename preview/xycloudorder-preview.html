<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XyCloudStore - Purple Edition</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#6C2BE2;--primary-deep:#4A12B8;--violet:#8B5CF6;--cyan:#8B5CF6;--gold:#D9A441;
  --ink:#1A1033;--ink-soft:#453B5E;--muted:#7C7391;--line:#EAE3F7;--line-soft:#F4F0FD;
  --bg:#FAF8FF;--surface:#fff;--ok:#16A34A;--warn:#D9880F;--danger:#DC2626;
  --r-sm:12px;--r-md:16px;--r-lg:20px;--r-xl:26px;--r-pill:100px;
  --sh-xs:0 2px 8px rgba(11,18,32,.035);
  --sh-sm:0 6px 16px rgba(11,18,32,.05);
  --sh-md:0 12px 28px rgba(11,18,32,.07),0 1px 4px rgba(11,18,32,.03);
}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;
  background:radial-gradient(1200px 700px at 15% 10%,#4A12B8 0%,#33087F 45%,#080d18 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;
  padding:36px 22px;flex-wrap:wrap;color:#fff;letter-spacing:-.01em}

/* ---------- panel kiri ---------- */
.side{max-width:340px}
.tagline{display:inline-flex;align-items:center;gap:7px;background:rgba(167,139,250,.10);color:#C4B5FD;
  border:1px solid rgba(167,139,250,.24);padding:6px 13px;border-radius:var(--r-pill);
  font-size:10.5px;font-weight:800;letter-spacing:1.4px;margin-bottom:20px}
.side h1{font-size:34px;font-weight:800;letter-spacing:-1.6px;line-height:1.1;margin-bottom:16px}
.side h1 em{font-style:normal;background:linear-gradient(95deg,#C4B5FD,#8f7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.side p{color:#94a3b8;font-size:13.5px;line-height:1.75;margin-bottom:24px}
.feat{display:grid;gap:12px;margin-bottom:26px}
.feat div{display:flex;gap:11px;align-items:flex-start;font-size:12.5px;color:#cbd5e1;line-height:1.55}
.feat svg{flex:none;margin-top:1px}
.feat b{color:#fff;font-weight:700}
.side-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);color:#e2e8f0;padding:11px 18px;border-radius:var(--r-sm);
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.18s}
.side-btn:hover{background:rgba(255,255,255,.12)}

/* ---------- perangkat ---------- */
.phone{width:392px;height:830px;background:#05070d;border-radius:54px;padding:11px;flex:none;
  box-shadow:0 60px 110px rgba(0,0,0,.6),0 0 0 2px #23262e inset,0 0 0 9px #0d1017}
.screen{width:100%;height:100%;background:var(--bg);border-radius:44px;overflow:hidden;position:relative;color:var(--ink)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:104px;height:29px;background:#05070d;
  border-radius:20px;z-index:90}
.sbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;font-size:12.5px;font-weight:700;z-index:85;pointer-events:none}
.sbar.light{color:#fff}
.app{position:absolute;inset:46px 0 0 0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.app::-webkit-scrollbar{display:none}
.app.full{inset:0}
.app.hasnav{bottom:78px}
.pad{padding:6px 22px 28px}

/* ---------- primitif ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-sm)}
.card.tap{cursor:pointer;transition:transform .14s,box-shadow .18s}
.card.tap:active{transform:scale(.978);box-shadow:var(--sh-xs)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.sp{flex:1}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.sec{display:flex;align-items:flex-start;margin:26px 0 14px}
.sec h3{font-size:17.5px;font-weight:800;letter-spacing:-.45px}
.sec span{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px;letter-spacing:0}
.sec a{margin-left:auto;color:var(--primary);font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:2px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5.5px 10px;border-radius:var(--r-pill);
  font-size:11px;font-weight:800;border:1px solid transparent}
.spec{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:9px;background:var(--line-soft);
  font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.btn{width:100%;border:0;border-radius:var(--r-md);height:56px;font-weight:800;font-size:15px;cursor:pointer;
  font-family:inherit;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .14s,filter .18s;
  background:linear-gradient(135deg,var(--primary),#5B16CC);color:#fff;box-shadow:0 12px 26px rgba(108,43,226,.3)}
.btn:active{transform:scale(.975)}
.btn:disabled{background:#E3DAF5;color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn.sm{height:47px;font-size:14px;border-radius:14px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh-xs)}
.btn.violet{background:linear-gradient(135deg,var(--violet),var(--primary));box-shadow:0 12px 26px rgba(139,92,246,.3)}
.btn.glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:#fff;box-shadow:none}
.chip{padding:9px 15px;border-radius:var(--r-pill);border:1px solid var(--line);background:#fff;font-size:12.5px;
  font-weight:800;cursor:pointer;white-space:nowrap;font-family:inherit;color:var(--ink);transition:.16s}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 6px 14px rgba(108,43,226,.25)}
.scrollx{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.bar{height:7px;border-radius:10px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:10px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--r-md);padding:16px 16px 16px 46px;
  font-size:14px;font-family:inherit;outline:none;color:var(--ink);transition:.18s}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(108,43,226,.09)}
.inp-wrap{position:relative}
.inp-wrap .lead{position:absolute;left:16px;top:50%;transform:translateY(-50%);pointer-events:none}
.inp-wrap .trail{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer}
.lbl{font-size:12.5px;font-weight:700;margin:0 0 9px 2px;display:block}
.thumb{border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;flex:none;position:relative;overflow:hidden}
.thumb::after{content:'';position:absolute;width:130%;height:60%;left:-15%;top:-20%;background:rgba(255,255,255,.11);
  border-radius:50%}
.thumb svg{position:relative;z-index:1}
.live{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 7px;border-radius:var(--r-pill);
  font-size:11px;font-weight:800}
.live .p{position:relative;width:14px;height:14px;display:flex;align-items:center;justify-content:center}
.live .p b{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.live .p i{position:absolute;width:14px;height:14px;border-radius:50%;background:currentColor;opacity:.3;animation:pulse 1.6s infinite}
@keyframes pulse{0%{transform:scale(.45);opacity:.4}100%{transform:scale(1.2);opacity:0}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hide{display:none!important}
.fade{animation:fade .42s cubic-bezier(.2,.9,.3,1) both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{animation:fade .5s cubic-bezier(.2,.9,.3,1) both}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.07s}
.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.17s}
.stagger>*:nth-child(5){animation-delay:.22s}.stagger>*:nth-child(6){animation-delay:.27s}

/* ---------- nav ---------- */
.nav{position:absolute;bottom:0;left:0;right:0;height:78px;background:#fff;border-top:1px solid var(--line);
  display:flex;align-items:flex-start;padding:9px 8px 0;z-index:60;box-shadow:0 -6px 24px rgba(11,18,32,.06)}
.nav button{flex:1;background:0;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;position:relative}
.nav .ico{width:40px;height:32px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;
  transition:width .26s cubic-bezier(.2,.9,.3,1),background .2s}
.nav button.on .ico{width:58px;background:linear-gradient(135deg,var(--primary),#5B16CC);box-shadow:0 8px 18px rgba(108,43,226,.3)}
.nav button.on{color:var(--primary);font-weight:800}
.nav .bdg{position:absolute;top:-2px;right:26px;background:var(--danger);color:#fff;font-size:8.5px;min-width:16px;
  height:16px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;border:1.5px solid #fff}

/* ---------- dark layer (splash / welcome) ---------- */
.dark{position:absolute;inset:0;background:linear-gradient(150deg,#1A1033,#2E1065 55%,#4A12B8);overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(2px)}
.dotgrid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.055) 1.1px,transparent 1.1px);
  background-size:26px 26px}

/* ---------- sheet & toast ---------- */
.sheet{position:absolute;inset:0;background:rgba(11,18,32,.5);backdrop-filter:blur(3px);z-index:95;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .inner{background:var(--bg);width:100%;max-height:90%;border-radius:28px 28px 0 0;overflow-y:auto;
  animation:up .38s cubic-bezier(.2,.9,.3,1);scrollbar-width:none;padding-bottom:18px}
.sheet .inner::-webkit-scrollbar{display:none}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:42px;height:4.5px;background:var(--line);border-radius:10px;margin:13px auto}
.toast{position:absolute;bottom:100px;left:22px;right:22px;background:var(--ink);color:#fff;padding:14px 17px;
  border-radius:var(--r-sm);font-size:12.5px;font-weight:600;z-index:98;opacity:0;transform:translateY(14px);
  transition:.32s cubic-bezier(.2,.9,.3,1);pointer-events:none;display:flex;align-items:center;gap:10px;box-shadow:var(--sh-md)}
.toast.on{opacity:1;transform:none}

/* ---------- chat ---------- */
.msgs{padding:16px 18px 8px;display:flex;flex-direction:column;gap:9px}
.bub{max-width:76%;padding:11px 15px 9px;border-radius:19px;font-size:13.5px;line-height:1.48;box-shadow:var(--sh-xs)}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--primary),#4A6BFF);color:#fff;border-bottom-right-radius:6px}
.bub.cs{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.bub.sys{align-self:center;background:var(--line-soft);color:var(--muted);font-size:11.5px;border-radius:20px;
  padding:8px 15px;text-align:center;max-width:88%;box-shadow:none}
.bub .meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:9.5px;opacity:.68;margin-top:4px}
.typing{align-self:flex-start;background:#fff;border:1px solid var(--line);padding:15px 17px;
  border-radius:19px 19px 19px 6px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#94a3b8;animation:bnc 1s infinite}
.typing i:nth-child(2){animation-delay:.14s}.typing i:nth-child(3){animation-delay:.28s}
@keyframes bnc{0%,60%,100%{transform:none;opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.composer{position:absolute;bottom:78px;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  padding:11px 14px;display:flex;gap:9px;align-items:center;z-index:55}
.composer input{flex:1;border:0;background:var(--bg);border-radius:24px;padding:13px 17px;font-size:13.5px;
  font-family:inherit;outline:none;color:var(--ink)}
.send{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;flex:none;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(135deg,var(--primary),#5B16CC);box-shadow:0 8px 18px rgba(108,43,226,.32)}

/* ---------- timeline ---------- */
.tl{display:flex;gap:15px}
.tl-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1.6px solid var(--line);background:var(--bg);flex:none;transition:.35s}
.tl-dot.on{background:linear-gradient(135deg,var(--primary),#5B16CC);border-color:transparent}
.tl-dot.cur{box-shadow:0 0 0 5px rgba(108,43,226,.14)}
.tl-line{width:2px;flex:1;background:var(--line);margin:3px auto}
.tl-line.on{background:var(--primary)}

/* ---------- onboarding ---------- */
.dots{display:flex;justify-content:center;gap:7px}
.dots i{width:7px;height:7px;border-radius:10px;background:var(--line);transition:.32s cubic-bezier(.2,.9,.3,1)}
.dots i.on{width:26px}
.float{position:absolute;display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  padding:8px 12px;border-radius:var(--r-pill);font-size:11px;font-weight:800;box-shadow:var(--sh-sm);
  animation:flt 4s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
.halo{position:absolute;width:250px;height:250px;border-radius:50%;animation:brt 5s ease-in-out infinite}
@keyframes brt{0%,100%{transform:scale(.96)}50%{transform:scale(1.05)}}
@media(max-width:900px){.side{max-width:392px}}
</style>
</head>
<body>

<div class="side">
  <div class="tagline">PREMIUM EDITION</div>
  <h1>XyCloud<em>Order</em></h1>
  <p>Preview interaktif dari aplikasi Flutter di folder <b style="color:#e2e8f0">xycloud/app</b>. Alur, warna, dan komponennya identik dengan kode Dart-nya. Nol emoji, seluruh ikon memakai sistem SVG.</p>
  <div class="feat" id="featList"></div>
  <button class="side-btn" onclick="ulangFlow()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    Ulangi dari Splash
  </button>
</div>

<div class="phone">
  <div class="island"></div>
  <div class="screen">
    <div class="sbar" id="sbar"><span>09:41</span><span id="sbarR"></span></div>
    <div class="app full" id="app"></div>
    <div class="composer hide" id="composer">
      <input id="chatInput" placeholder="Tulis pesan..." autocomplete="off">
      <button class="send" onclick="kirim()"></button>
    </div>
    <div class="nav hide" id="nav"></div>
    <div class="sheet" id="sheet" onclick="if(event.target===this)tutupSheet()"><div class="inner" id="sheetInner"></div></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>

   SISTEM IKON SVG  (tanpa emoji sama sekali)

  ram:'<rect x="2.5" y="7" width="19" height="10" rx="2"/><path d="M6 17v2.5M10 17v2.5M14 17v2.5M18 17v2.5M6.5 10.5h3M11 10.5h3M15.5 10.5h2"/>',

  shield:'<path d="M12 2.8 4.5 6v6c0 4.6 3.2 8.4 7.5 9.3 4.3-.9 7.5-4.7 7.5-9.3V6L12 2.8Z"/>',
  shieldCheck:'<path d="M12 2.8 4.5 6v6c0 4.6 3.2 8.4 7.5 9.3 4.3-.9 7.5-4.7 7.5-9.3V6L12 2.8Z"/><path d="m8.8 12 2.2 2.2 4.2-4.4"/>',
  lock:'<rect x="4.5" y="10" width="15" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',

  send:'<path d="M21.5 3.5 2.5 11l7.5 2.5L12.5 21l9-17.5Z"/><path d="m10 13.5 4-4"/>',
  clip:'<path d="M20 11.5 12 19.5a5 5 0 0 1-7-7L14 3.5a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/>',
  play:'<circle cx="12" cy="12" r="9.2"/><path d="M10 8.5 16 12l-6 3.5v-7Z"/>',
  refresh:'<path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M21 3v5h-5"/>',
  user:'<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c1-4 4-6 7.5-6s6.5 2 7.5 6"/>',

  });

function konstelasi(){
  const svg=document.getElementById('consvg'); if(!svg)return;
  const W=370,H=808,pts=[];
  let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  for(let i=0;i<18;i++)pts.push([rnd()*W,rnd()*H]);
  let s='';
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const d=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]);
    if(d<140)s+=`<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[j][0]}" y2="${pts[j][1]}" stroke="rgba(255,255,255,.06)" stroke-width=".9"/>`}
  pts.forEach(([x,y],i)=>s+=`<circle cx="${x}" cy="${y}" r="1.6" fill="rgba(255,255,255,.24)">
    <animate attributeName="opacity" values=".1;.5;.1" dur="${3+i%4}s" repeatCount="indefinite"/></circle>`);
  svg.innerHTML=s;
}

function ring(v,size=66){
  const r=size/2-size*.05, c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C2BE2"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EAE3F7" stroke-width="${size*.1}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#rg)" stroke-width="${size*.1}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v)}" transform="rotate(-90 ${size/2} ${size/2})"
      style="transition:stroke-dashoffset .7s cubic-bezier(.2,.9,.3,1)"/>
    <text x="50%" y="50%" text-anchor="middle" dy=".35em" font-size="${size*.21}" font-weight="800" fill="#1A1033"
      font-family="inherit">${Math.round(v*100)}%</text></svg>`;
}

function go(t){S.tab=t;if(t===4)S.notif=0;render()}
function bukaOrder(id){S.detailOrder=id;S.tab=6;render()}
function bukaCheckout(id){S.checkout=id;S.jamPilih=3;S.tab=7;render()}
function topup(n){S.user.saldo+=n;S.trx.unshift({judul:'Top up saldo',tipe:'topup',n,t:Date.now()});
  toast('Top up '+rp(n)+' berhasil.','checkCircle');render()}
function keluar(){S.layar='welcome';S.tab=0;render();toast('Kamu sudah keluar dari akun.','logout')}
function ulangFlow(){S.layar='splash';S.ob=0;S.tab=0;render();
  setTimeout(()=>{S.layar='onboarding';render()},2400)}

function bayar(total){
  const p=S.plans.find(x=>x.id===S.checkout);
  if(S.metode==='saldo'&&S.user.saldo<total){toast('Saldo tidak cukup. Top up dulu ya.','warn');return}
  if(S.metode==='saldo')S.user.saldo-=total;
  p.ready=Math.max(0,p.ready-1);
  const o={id:'o'+Date.now(),kode:'XY-'+(9000+Math.floor(Math.random()*999)),planId:p.id,plan:p.nama,
    jam:S.jamPilih,total,status:'pending',progress:0,dibuat:Date.now()};
  S.orders.unshift(o);
  S.trx.unshift({judul:`Sewa ${p.nama} ${S.jamPilih} jam`,tipe:'sewa',n:-total,t:Date.now()});
  S.detailOrder=o.id;S.tab=6;render();
  toast('Order dibuat. Server sedang memproses.','checkCircle');
}

function kirim(teks){
  const inp=document.getElementById('chatInput');
  const t=(teks||(inp?inp.value:'')).trim(); if(!t)return;
  if(inp)inp.value='';
  S.chat.push({dari:'user',teks:t,t:Date.now()}); render();
  setTimeout(()=>{S.typing=true;render()},420);
  setTimeout(()=>{S.typing=false;S.chat.push({dari:'cs',teks:balasan(t),t:Date.now()});
    if(S.tab!==4)S.notif++; render()},1700+Math.random()*900);
}
function balasan(p){p=p.toLowerCase();
  if(/lag|lemot|putus/.test(p))return'Baik kak, coba pindah region ke Jakarta dulu lewat menu Sewa PC. Kalau masih lag, Xy bantu migrasi mesin gratis tanpa biaya.';
  if(/refund|uang/.test(p))return'Untuk refund, saldo otomatis kembali maksimal 1x24 jam kak. Boleh kirim kode ordernya?';
  if(/akun|garansi/.test(p))return'Semua akun bergaransi kak, kalau bermasalah langsung kami replace tanpa biaya.';
  if(/bayar|qris|topup|top up/.test(p))return'Pembayaran bisa QRIS, e-wallet, dan transfer bank. Saldo masuk otomatis di bawah 1 menit kak.';
  if(/halo|hai|pagi|malam/.test(p))return'Halo kak, Xy siap bantu. Mau sewa PC, beli akun, atau ada kendala order?';
  return'Siap kak, pesanmu sudah Xy catat. Tim teknis sedang mengecek, mohon tunggu sebentar ya.';
}

        stroke="${gelap?'#fff':'#1A1033'}" stroke-opacity=".5"/><rect x="2.4" y="2.4" width="15" height="8.2" rx="1.8"
        fill="${gelap?'#fff':'#1A1033'}"/><path d="M23.6 4.4v4.2c1-.3 1.6-1 1.6-2.1s-.6-1.8-1.6-2.1Z" fill="${gelap?'#fff':'#1A1033'}" fill-opacity=".5"/></svg>
    </span>`;

  if(S.layar!=='app'){
    nav.classList.add('hide'); comp.classList.add('hide');
    app.className='app full';
    app.innerHTML={splash:vSplash,onboarding:vOnboarding,welcome:vWelcome,login:vLogin}[S.layar]();
    if(S.layar==='welcome')setTimeout(konstelasi,10);
    return;
  }

  nav.classList.remove('hide');
  app.className='app hasnav';
  const keep=app.scrollTop;
  app.innerHTML=[vHome,vSewa,vAkun,vOrder,vCs,vWallet,vDetail,vCheckout][S.tab]();
  if(S.tab===4){comp.classList.remove('hide');app.scrollTop=99999}

  const tabs=[['grid','Beranda',0],['desktop','Sewa PC',1],['store','Akun',2],['receipt','Order',3],['headset','Bantuan',4]];
  const map={5:0,6:3,7:1}; const aktif=map[S.tab]!==undefined?map[S.tab]:S.tab;
  nav.innerHTML=tabs.map(([i,l,t])=>`<button class="${t===aktif?'on':''}" onclick="go(${t})">
    <span class="ico">${ic(i,20,t===aktif?'#fff':'#7C7391')}</span>${l}
    ${t===4&&S.notif?`<span class="bdg">${S.notif}</span>`:''}</button>`).join('');
  document.querySelector('.send').innerHTML=ic('send',19,'#fff');
}

/* simulasi realtime */
setInterval(()=>{
  if(S.layar!=='app')return;
  let ubah=false;
  if(Math.random()>.5){const p=S.plans[Math.floor(Math.random()*S.plans.length)];
    const d=Math.random()>.5?1:-1, b=Math.min(p.total,Math.max(0,p.ready+d));
    if(b!==p.ready){p.ready=b;ubah=true}}
  S.orders.forEach(o=>{
    if(o.status==='pending'){o.status='dibayar';ubah=true}
    else if(o.status==='dibayar'){o.status='provisioning';o.progress=12;ubah=true}
    else if(o.status==='provisioning'){o.progress=Math.min(100,o.progress+25+Math.floor(Math.random()*20));
      if(o.progress>=100){o.status='aktif';o.berakhir=Date.now()+o.jam*3.6e6;
        o.host='103.44.12.'+(20+Math.floor(Math.random()*200))+':3389';
        o.user='xy_'+o.kode.toLowerCase().replace('-','');o.pass='Xy#'+Math.floor(Math.random()*9999)+'ok';
        toast(o.kode+' aktif. PC siap dipakai.','rocket')}
      ubah=true}
    else if(o.status==='aktif'&&o.berakhir<Date.now()){o.status='selesai';ubah=true}});
  if(ubah)render();
},3000);
setInterval(()=>{if(S.layar==='app'&&[0,3,6].includes(S.tab))render()},1000);

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.activeElement.id==='chatInput')kirim();
});

/* mulai: splash -> onboarding otomatis */
render();
setTimeout(()=>{S.layar='onboarding';render()},2400);
</script>
</body>
